<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>believe.ai — Believe in your next opportunity</title>
    <meta name="description" content="AI-powered outreach and communication platform." />
    <script>
      // Applies the stored appearance before first paint. Without this, React
      // mounts after the browser has already painted a light page, so a
      // dark-mode user sees a white flash on every load — and a Modern user
      // would additionally see the classic shell's palette flash first.
      //
      // Mirrors applyAppearance() in app/providers/ThemeProvider.tsx.
      (function () {
        try {
          var storedScheme = localStorage.getItem("believe-ai:theme");
          // "system" is the retired third option — anyone still carrying it
          // resolves against the OS once, same as the provider does.
          var dark =
            storedScheme === "dark" ||
            (storedScheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var experience = localStorage.getItem("believe-ai:experience") === "modern" ? "modern" : "classic";

          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.experience = experience;
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          // localStorage can throw in private mode — fall back to light/classic.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
