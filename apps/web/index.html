<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>believe.ai — Believe in your next opportunity</title>
    <meta name="description" content="AI-powered outreach and communication platform." />
    <script>
      // Applies the stored theme before first paint. Without this, React
      // mounts after the browser has already painted a light page, so a
      // dark-mode user sees a white flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem("believe-ai:theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          // localStorage can throw in private mode — fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
