# Self-hosted Judge0 CE configuration — local development only.
#
# This backs services/judge0_execution_service.py's SELF-HOSTED path (see
# apps/backend/clients/judge0_client.py) as a free, no-API-key alternative to
# the RapidAPI-hosted Judge0 that services/code_sandbox_service.py already
# used for Interview Prep. No AUTHN/AUTHZ tokens are set below, so the API on
# port 2358 is unauthenticated — fine bound to localhost for local dev, never
# expose this port publicly without setting AUTHN_TOKEN/AUTHZ_TOKEN.
#
# The passwords below are local-only, used solely for the internal Docker
# network between judge0-server/judge0-workers and their own db/redis
# containers — never exposed outside this compose network.

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-local-dev-only

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-local-dev-only

RAILS_ENV=production
RAILS_MAX_THREADS=5

JUDGE0_HOMEPAGE=https://judge0.com
JUDGE0_VERSION=1.13.1

MAINTENANCE_MODE=false
MAINTENANCE_MODE_MESSAGE="Judge0 is currently undergoing maintenance and will be back online soon."

ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=false
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
ALLOWED_CALLBACKS_ONLY=false
ENABLE_ADDITIONAL_FILES=false
ALLOW_ENABLE_NETWORK=false
ALLOW_ORIGIN=*

MAX_QUEUE_SIZE=50

# Deliberately modest — this host has ~1.5GB free in the Docker VM, so a
# single lean worker beats Judge0's CPU-count-scaled default of several.
COUNT=1
INTERVAL=0.5

CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=10
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=3
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=15
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=30
MAX_MAX_PROCESSES_AND_OR_THREADS=60
# This host's kernel is cgroup v2-only (Docker Desktop/WSL2), but the
# isolate binary bundled in judge0/judge0:1.13.1 (isolate 1.8.1, built 2021)
# only understands the legacy cgroup v1 per-controller layout — confirmed
# via `isolate-check-environment` inside judge0-workers, which reports the
# memory/cpuacct/cpuset v1 controllers as absent. Per app/jobs/isolate_job.rb,
# isolate only runs WITHOUT --cg (falling back to plain rlimit/namespace
# isolation — still a real sandboxed box, just without cgroup accounting)
# when BOTH of these are true. This is a real, if less precise, fallback:
# genuine chroot/namespace isolation, setrlimit()'d CPU/memory/output caps,
# dropped privileges, no network — just not cgroup-enforced.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096

AUTHN_HEADER=
AUTHN_TOKEN=
AUTHZ_HEADER=
AUTHZ_TOKEN=
