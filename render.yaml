# Render Blueprint — deploys the backend and frontend in one "New Blueprint"
# pass. https://render.com/docs/blueprint-spec
#
# The arq background worker — the process that actually sends campaign
# emails and follow-ups — is deliberately NOT here. Render's free plan has
# no background-worker tier (confirmed against Render's docs; a real
# Apply attempt failed trying to create one on `plan: free`), and a paid
# plan is a real cost decision for you to make, not one to default into
# silently. .github/workflows/worker.yml runs the same worker code for
# free instead, via arq's own `--burst` mode (drain what's due, then
# exit) on a GitHub Actions schedule — see that file for the setup steps
# and the latency/reliability trade-offs that come with polling instead
# of an always-on process.
#
# What this does NOT do, and why:
#   - Provision MongoDB. Render has no managed MongoDB; MONGODB_URI must
#     point at an external cluster (MongoDB Atlas's free tier is the usual
#     choice) and is left blank below for you to paste into the dashboard.
#   - Fill in any secret (Firebase, Gemini/Groq, ENCRYPTION_KEY, …). Render
#     Blueprints intentionally never let a value live in this file for
#     `sync: false` vars — you paste those once in the dashboard after the
#     first "Apply", and they're never in git.
#
# One-time setup this file can't do for you:
#   1. New Blueprint → connect this repo → Apply. Render creates the two
#      app services and the Key Value (Redis-compatible) instance below,
#      both failing to boot until (2).
#   2. believe-ai-backend → Environment tab → fill in every `sync: false`
#      var (values come from apps/backend/.env — never commit that file).
#   3. web (the frontend)'s VITE_API_BASE_URL should be the backend's
#      Render URL (shown on the backend service's page) plus no trailing
#      slash; then trigger a manual redeploy of `web` so Vite bakes it in
#      (VITE_* vars are inlined at build time, not read at runtime).
#   4. Backend's CORS_ORIGIN should be the frontend's Render URL once you
#      know it; APP_BASE_URL should be the backend's OWN Render URL (it
#      builds the {app_base_url}/t/open/... tracking-pixel and click links
#      in outbound campaign emails — see worker/jobs/send_campaign_email.py).
#      Redeploy the backend after setting either.
#   5. believe-ai-redis's page → Connect tab → copy the EXTERNAL connection
#      string (not the internal one the backend uses via fromService below)
#      into the worker.yml GitHub Actions secret named REDIS_URL — GitHub's
#      runners aren't on Render's private network, so the internal URL
#      won't resolve for them.
#
#   Known pre-existing gap, not introduced by this file: api/routes/
#   integrations.py also reads APP_BASE_URL, but to redirect the browser
#   back to a *frontend* route after a Gmail/Outlook OAuth connect
#   (`{app_base_url}/settings/integrations?...`). One setting can't
#   correctly be both the backend's own URL and the frontend's URL at
#   once. Campaign tracking links matter more of the two and are what
#   APP_BASE_URL is set to below, so on this deploy, finishing a Gmail/
#   Outlook OAuth connect will redirect to a 404 on the backend instead
#   of back to the app. Fix (not applied here, out of scope for a deploy
#   config): add a separate FRONTEND_URL setting and point
#   integrations.py at that instead.
#
# Plan note: `free` is a real plan name for web and keyvalue (confirmed
# against Render's docs — it is NOT valid for `type: worker`, which is why
# there's no worker service here at all). Nothing here purchases anything
# on its own, and I won't select a paid plan without asking you first.

services:
  # FastAPI app — every HTTP route.
  - type: web
    name: believe-ai-backend
    runtime: python
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: CORS_ORIGIN
        sync: false # the frontend's Render URL, e.g. https://believe-ai-web.onrender.com
      - key: MONGODB_URI
        sync: false # external MongoDB Atlas connection string — Render doesn't host Mongo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: believe-ai-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false # this service's own public URL once known — used to build tracking links
      - key: AI_PROVIDER_ORDER
        value: gemini,groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # Vite SPA. Built from the repo root (not apps/web) because it depends
  # on the pnpm workspace's packages/shared, which must be built first.
  - type: web
    name: believe-ai-web
    runtime: static
    # No `plan:` here — Render's static sites have no compute plan to pick;
    # putting `free` (a web-service plan name) triggered a real validation
    # error on Apply: "no such plan free for service type web".
    #
    # No `corepack enable` or `pnpm install` here either — Render detects
    # the pnpm workspace and runs its own install before buildCommand runs
    # at all (visible in the build log as "Installing dependencies with
    # pnpm... Scope: all 4 workspace projects"). Calling `corepack enable`
    # on top of that crashed the real build with "EROFS: read-only file
    # system, unlink '/usr/bin/pnpm'" — it tries to relink a pnpm binary
    # Render's image already manages read-only. buildCommand only needs to
    # run the two workspace builds Render's own install doesn't do for you.
    buildCommand: pnpm --filter @believe-ai/shared build && pnpm --filter @believe-ai/web build
    staticPublishPath: apps/web/dist
    # A client-side router needs every path served index.html, or a
    # refresh on e.g. /app/campaigns 404s instead of reaching React Router.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # the backend service's Render URL — see step 3 above
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

  # Render's managed Redis-compatible store — backs the API's own use of
  # Redis and, externally, the GitHub Actions worker's arq queue (see
  # worker.yml). `type: keyvalue` is the current name for what the
  # dashboard still shows as "Redis".
  #
  # ipAllowList is 0.0.0.0/0 (allow all external), not empty: the GitHub
  # Actions worker connects from outside Render's network on runners with
  # no fixed IP range, so an empty list (block all external) would lock
  # it out entirely along with everyone else. The connection string's own
  # embedded credential is the real access control here, the same trust
  # model as pointing MONGODB_URI at an Atlas cluster opened to 0.0.0.0/0.
  - type: keyvalue
    name: believe-ai-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: needed for the external GitHub Actions worker (see worker.yml); the connectionString's credential is the actual access control
